<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Cotopaxi WebAR — Ecuador</title>

  <!-- MindAR + A-Frame. No app installation required. -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #intro {
      position: fixed; z-index: 10; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.82); color: white;
      font-family: Arial, sans-serif; text-align: center; padding: 28px;
    }
    #intro .box { max-width: 360px; }
    #start {
      border: 0; border-radius: 999px; padding: 14px 24px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      background: #ffc72c; color: #111; margin-top: 14px;
    }
    #hint {
      position: fixed; z-index: 9; left: 50%; bottom: 28px;
      transform: translateX(-50%);
      color: white; background: rgba(0,0,0,.55);
      border-radius: 999px; padding: 10px 16px;
      font: 14px Arial, sans-serif; text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="intro">
    <div class="box">
      <h2>Descubre el Cotopaxi</h2>
      <p>Permite el acceso a la cámara y apunta al frente de la tarjeta.</p>
      <button id="start">Activar cámara</button>
    </div>
  </div>

  <div id="hint">Apunta a la imagen del Cotopaxi</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="cotopaxiVideo"
             src="./cotopaxi-demo.mp4"
             preload="auto"
             loop
             muted
             playsinline
             crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex 0 = the first image compiled into targets.mind -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#cotopaxiVideo"
        position="0 0 0"
        width="1"
        height="0.648"
        rotation="0 0 0">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const intro = document.getElementById('intro');
    const start = document.getElementById('start');
    const video = document.getElementById('cotopaxiVideo');
    const scene = document.querySelector('a-scene');

    start.addEventListener('click', async () => {
      intro.style.display = 'none';
      try {
        await video.play();
        video.pause();
        video.currentTime = 0;
      } catch(e) {}
      const mindar = scene.systems['mindar-image-system'];
      if (mindar) mindar.start();
    });

    scene.addEventListener('targetFound', () => {
      video.play().catch(() => {});
      document.getElementById('hint').textContent = '¡Cotopaxi detectado!';
    });

    scene.addEventListener('targetLost', () => {
      video.pause();
      document.getElementById('hint').textContent = 'Apunta a la imagen del Cotopaxi';
    });
  </script>
</body>
</html>
